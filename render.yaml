# Render Blueprint: free FastAPI web service.
# Keep secrets out of GitHub; Render will ask for values marked sync: false.
services:
  - type: web
    name: bot-center-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Bot Center
      - key: APP_ENV
        value: production
      - key: OWNER_ID
        value: "1916071119"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BOT_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: SS_FBot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://sajadggrr.github.io/Bot-Center/
